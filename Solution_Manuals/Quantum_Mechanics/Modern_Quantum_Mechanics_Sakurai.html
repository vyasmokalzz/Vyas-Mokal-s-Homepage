<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Modern Quantum Mechanics - Sakurai Solutions</title>
    <style>
        body{margin:0;font-family:Arial,Helvetica,sans-serif}
        header{padding:12px;background:#f3f3f3;border-bottom:1px solid #ddd}
        a.back{color:#333;text-decoration:none}
        #viewer{height:calc(100vh - 50px)}
        iframe{width:100%;height:100%;border:0}
        .msg{padding:20px}
        .ios-fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 50px);
            padding: 32px 24px;
            text-align: center;
            gap: 16px;
            background: #f3f3f3;
        }
        .ios-fallback svg { width: 64px; height: 64px; opacity: 0.5; }
        .ios-fallback p { font-size: 15px; color: #666; line-height: 1.5; max-width: 280px; }
        .open-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <header>
        <a class="back" href="../../index.html">← Back to homepage</a>
    </header>
    <div id="viewer">
        <iframe id="pdfFrame" title="PDF viewer"></iframe>
        <div id="ios-fallback" class="ios-fallback">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="12" y1="12" x2="12" y2="18"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <p>Safari on iPhone can't display PDFs inside a page. Tap below to open it in the full PDF viewer.</p>
            <a id="ios-open-btn" class="open-btn" href="#" target="_blank">Open PDF</a>
        </div>
    </div>

    <script>
    function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    function isIOS() {
        return /iP(hone|ad|od)/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    const fileParam = getQueryParam('file');
    let pdfFile = 'Modern_Quantum_Mechanics_J_J__Sakurai.pdf';
    
    if (fileParam) {
        const decoded = decodeURIComponent(fileParam);
        if (!decoded.includes('..')) {
            pdfFile = decoded;
        }
    }

    if (isIOS()) {
        document.getElementById('pdfFrame').style.display = 'none';
        document.getElementById('ios-fallback').style.display = 'flex';
        document.getElementById('ios-open-btn').href = pdfFile;
    } else {
        document.getElementById('pdfFrame').src = pdfFile;
    }
    </script>
</body>
</html>
