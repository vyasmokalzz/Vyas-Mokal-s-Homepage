<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PDF Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #2a2a2a;
            border-bottom: 1px solid #3a3a3a;
            min-height: 50px;
            flex-shrink: 0;
        }

        a.back {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        a.back:hover { color: #fff; }

        .filename {
            font-size: 13px;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #viewer {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Desktop: full iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* iOS fallback panel */
        .ios-fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 32px 24px;
            text-align: center;
            gap: 16px;
        }

        .ios-fallback svg {
            width: 64px;
            height: 64px;
            opacity: 0.5;
        }

        .ios-fallback p {
            font-size: 15px;
            color: #aaa;
            line-height: 1.5;
            max-width: 280px;
        }

        .open-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            color: #111;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 4px;
        }

        .open-btn:active { opacity: 0.8; }

        .msg {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
            font-size: 15px;
            padding: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <a class="back" href="index.html">← Back</a>
        <span class="filename" id="filename"></span>
    </header>
    <div id="viewer"></div>

    <script>
    function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    function isIOS() {
        return /iP(hone|ad|od)/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    const fileParam = getQueryParam('file');
    const viewer = document.getElementById('viewer');

    if (!fileParam) {
        viewer.innerHTML = '<div class="msg">No file specified.</div>';
    } else {
        const decoded = decodeURIComponent(fileParam);

        if (decoded.includes('..') || decoded.startsWith('/') || /^[a-z]+:\/\//i.test(decoded)) {
            viewer.innerHTML = '<div class="msg">Invalid file path.</div>';
        } else {
            // Show filename in header
            const parts = decoded.split('/');
            document.getElementById('filename').textContent = parts[parts.length - 1];

            if (isIOS()) {
                // iOS Safari can't embed PDFs in iframes — open natively
                viewer.innerHTML = `
                  <div class="ios-fallback" style="display:flex;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                      <polyline points="14 2 14 8 20 8"/>
                      <line x1="12" y1="12" x2="12" y2="18"/>
                      <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                    <p>Safari on iPhone can't display PDFs inside a page. Tap below to open it in the full PDF viewer.</p>
                    <a class="open-btn" href="${encodeURI(decoded)}" target="_blank">
                      Open PDF
                    </a>
                  </div>`;
            } else {
                // Desktop / Android — iframe works fine
                const iframe = document.createElement('iframe');
                iframe.title = 'PDF viewer';
                // Append #toolbar=1&view=FitH for better default zoom on smaller screens
                iframe.src = encodeURI(decoded) + '#toolbar=1&view=FitH';
                viewer.appendChild(iframe);
            }
        }
    }
    </script>
</body>
</html>
